name: cron-daily

on:
  schedule:
    # Filet de secours seulement : le vrai déclencheur est le minuteur Supabase (pg_cron) à 7h30 Paris,
    # qui appelle workflow_dispatch. GitHub exécute ses « schedule » avec plusieurs heures de retard.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: cron-daily
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # pire cas : 15 min (tentative trop longue) + 10 min (envoi de secours)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Le 6 oct. 2026, la toute première requête à Supabase a répondu 500 deux fois de suite depuis GitHub.
      # sql_exec réessaie déjà 5 fois ; en plus, le traitement complet est relancé jusqu'à 3 fois (il est idempotent :
      # ingestion sans doublon, abonnés déjà servis sautés).
      - name: Ingest today (+catch-up), phone enrichment, digests
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PYTHONUNBUFFERED: "1"          # journaux en direct (14 nov. 2026 : impossible de voir où ça bloquait)
        # Chaque tentative est plafonnée à 15 min (timeout) : une ingestion lente ne peut plus manger les 45 min du job.
        run: |
          cd pipeline
          for i in 1 2 3; do
            rc=0; timeout 15m python3 cron_github.py || rc=$?
            if [ "$rc" = "0" ]; then exit 0; fi
            # 124 = trop long : on ne relance pas (ce serait encore 15 min), on passe directement à l'envoi de secours
            if [ "$rc" = "124" ]; then echo "::error::ingestion trop longue (15 min), envoi de secours"; exit 1; fi
            echo "::warning::tentative $i échouée (code $rc), nouvelle tentative dans 30 s"
            sleep 30
          done
          exit 1

      # Filet de sécurité : si l'ingestion a échoué 3 fois, on envoie QUAND MÊME avec ce qui est en base
      # (dernière édition connue ; les abonnés de l'essai reçoivent au pire le message « relâche »). Idempotent :
      # un abonné déjà servi aujourd'hui est sauté.
      - name: Envoi de secours (sans ingestion)
        if: failure()
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          cd pipeline
          timeout 10m python3 send_digests.py

      - name: Upload artifacts (JSONL du jour, debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cessions-${{ github.run_id }}
          path: data/cessions/*.jsonl
          retention-days: 7
