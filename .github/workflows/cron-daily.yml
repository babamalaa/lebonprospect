name: cron-daily

on:
  schedule:
    # Filet de secours seulement : le vrai déclencheur est le minuteur Supabase (pg_cron) à 7h30 Paris,
    # qui appelle workflow_dispatch. GitHub exécute ses « schedule » avec plusieurs heures de retard.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: cron-daily
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Le 6 oct. 2026, la toute première requête à Supabase a répondu 500 deux fois de suite depuis GitHub.
      # sql_exec réessaie déjà 5 fois ; en plus, le traitement complet est relancé jusqu'à 3 fois (il est idempotent :
      # ingestion sans doublon, abonnés déjà servis sautés).
      - name: Ingest today (+catch-up), phone enrichment, digests
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          cd pipeline
          for i in 1 2 3; do
            if python3 cron_github.py; then exit 0; fi
            echo "::warning::tentative $i échouée, nouvelle tentative dans 60 s"
            sleep 60
          done
          exit 1

      - name: Upload artifacts (JSONL du jour, debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cessions-${{ github.run_id }}
          path: data/cessions/*.jsonl
          retention-days: 7
