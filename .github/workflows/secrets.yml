name: secrets

# Bloque tout secret (clé Google, Stripe, Resend, GitHub, jeton JWT…) poussé sur le dépôt, qui est PUBLIC.
# Scanne chaque push et chaque pull request, sur tous les chemins.
on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scanner les secrets (gitleaks)
        run: |
          V=8.21.2
          curl -sSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          tar xzf gl.tgz gitleaks
          # Historique complet au premier passage ou après une réécriture d'historique (commit précédent introuvable),
          # sinon uniquement les nouveaux commits
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            ./gitleaks git --no-banner --redact --log-opts="$BEFORE..${{ github.sha }}" .
          else
            ./gitleaks git --no-banner --redact .
          fi
